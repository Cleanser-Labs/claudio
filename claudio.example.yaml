# Claudio Proxy Configuration
# Copy to claudio.yaml and customize for your setup

# Proxy destinations with path-based routing
destinations:
  # Anthropic Claude API
  - name: anthropic
    url: https://api.anthropic.com
    paths:
      - /v1/messages
      - /v1/messages/*
    api_key_env: ANTHROPIC_API_KEY
    tts_enabled: true

  # OpenAI API (ChatGPT, GPT-4, etc.)
  - name: openai
    url: https://api.openai.com
    paths:
      - /openai/*
      - /v1/chat/*
      - /v1/completions/*
      - /v1/embeddings/*
    api_key_env: OPENAI_API_KEY
    tts_enabled: false  # Disable TTS for OpenAI responses

  # Local LLM (ollama, llama.cpp, etc.)
  # - name: local
  #   url: http://localhost:11434
  #   paths:
  #     - /local/*
  #     - /ollama/*
  #   tts_enabled: true

# Default destination when no path matches
default_destination: anthropic

# Session logging configuration
logging:
  enabled: false
  # Storage backend: 'jsonl' (JSON Lines files) or 'sqlite' (database)
  storage: jsonl
  # Directory for session logs
  dir: .claudio/sessions
  # Log full request bodies
  log_requests: true
  # Log full response content
  log_responses: true
  # Save generated audio files
  save_audio: true
  # Max sizes (0 = unlimited)
  max_request_size: 0
  max_response_size: 0

# TTS configuration
tts:
  # Backend: auto, say, soprano, kokoro, pocket, avfoundation, qwen3
  backend: auto
  # Voice name (backend-specific)
  voice: null
  # Speech speed multiplier (0.5-2.0)
  speed: 1.0
  # Audio output device ID (null = default)
  device: null

# Proxy server settings
proxy:
  host: 127.0.0.1
  port: 9000
  # Speak mode: 'auto' (all text), 'tags' (<say>...</say> only), 'off'
  speak_mode: tags
  # Notify on tool use: 'tools', 'approval', or comma-separated names
  notify: null
